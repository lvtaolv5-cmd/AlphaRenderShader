    BLOOM_ENABLED BLOOM_QUALITY=2 BLOOM_STRENGTH=0.40 \
    GLARE_ENABLED GLARE_MODE=0 GLARE_QUALITY=1 GLARE_STRENGTH=0.25 \
    !DOF_ENABLED DOF_QUALITY=2 \
    AA_MODE=1 FXAA_QUALITY=3 MSAA_SAMPLES=4 AA_SHARPENING=0.35 \
    WATER_MODE=1 WATER_REFLECTIONS WATER_REFRACTION !WATER_FOAM WATER_SSR_ENABLED WATER_SSR_STEPS=12 WATER_CAUSTICS WATER_WAVES_STRENGTH=1.00 \
    !WAVING_FOLIAGE WAVING_WATER FOLIAGE_SSS !RAIN_WETNESS !CA_ENABLED

profile.HIGH = \
    SHADOW_ENABLED shadowMapResolution=2048 shadowDistance=144.0 SHADOW_QUALITY=2 SHADOW_SOFTNESS=0.25 SHADOW_COLORED SHADOW_PIXEL=16 \
    SSAO_ENABLED SSAO_QUALITY=1 SSAO_STRENGTH=0.85 \
