# ============================================================================
# AlphaRender Shaders - EXTREME PERFORMANCE Master Pipeline Configuration
# Target: Minecraft 26.3 Fabric + Iris 1.12.0+ (Vulkan & OpenGL)
# Optimizations:
#   - True Hardware 0.5x0.5 Half-Res Bloom (colortex6) & Glare (colortex4)
#   - Hardware Early-Z Depth-Only shadow_solid pass (ZERO texture/discard!)
#   - Zero-cost Conditional Pass Skipping (program.*.enabled)
#   - 32-bit R11F_G11F_B10F / RGBA8 G-Buffers + Vertex-Hoisted Lighting
#   - Branchless Zero-pow() sRGB + Diagonal fastScreenToView + 1-pixel AutoExp
# ============================================================================

# ---------- Pipeline & Vanilla Controls ----------
clouds = fancy
oldLighting = false
oldHandLight = false
dynamicHandLight = true
separateAo = true
frustum.culling = true
shadow.culling = true
vignette = false
underwaterOverlay = false
sun = true
moon = true
stars = true
sky = true
weather = true
rain.depth = false
beacon.beam.depth = true

# Force Shadow Casting for Terrain, Entities, Player, Block Entities & Translucents!
shadowTerrain = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true
shadowTranslucent = true
dhShadow.enabled = false

iris.features.optional = PER_BUFFER_BLENDING ENTITY_TRANSLUCENT

# ---------- Hardware Half-Res Render Targets (4x Fewer Pixels Rasterized!) ----------
size.buffer.colortex4 = 0.5 0.5
size.buffer.colortex6 = 0.5 0.5

# ---------- Zero-Cost Conditional Pass Skipping ----------
program.shadow.enabled = SHADOW_ENABLED
program.shadow_solid.enabled = SHADOW_ENABLED

program.composite1.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.composite2.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.composite3.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.composite4.enabled = DOF_ENABLED

program.world-1/composite1.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.world-1/composite2.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.world-1/composite3.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.world-1/composite4.enabled = DOF_ENABLED

program.world1/composite1.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.world1/composite2.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.world1/composite3.enabled = BLOOM_ENABLED || GLARE_ENABLED
program.world1/composite4.enabled = DOF_ENABLED

# ---------- Per-Buffer Blending ----------
blend.gbuffers_armor_glint = SRC_COLOR ONE ZERO ONE
blend.gbuffers_clouds.colortex1 = off
blend.gbuffers_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_water.colortex1 = off
blend.gbuffers_water.colortex2 = ONE ONE ZERO ONE
blend.gbuffers_hand_water.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_hand_water.colortex1 = off
blend.gbuffers_hand_water.colortex2 = ONE ONE ZERO ONE
blend.gbuffers_particles_translucent.colortex1 = off
blend.gbuffers_entities_translucent.colortex1 = off
blend.gbuffers_textured.colortex1 = off
blend.gbuffers_textured_lit.colortex1 = off
blend.gbuffers_line = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_line.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_line.colortex1 = off
blend.gbuffers_line.colortex2 = ONE ONE ONE ONE
blend.gbuffers_basic.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_basic.colortex1 = off
blend.gbuffers_basic.colortex2 = ONE ONE ONE ONE

# ============================================================================
# 5-Tier Configuration Profiles (LOW / MEDIUM / HIGH / ULTRA / EXTREME)
# ============================================================================

profile.LOW = \
    SHADOW_ENABLED shadowMapResolution=1024 shadowDistance=80.0 SHADOW_QUALITY=1 SHADOW_SOFTNESS=0.00 !SHADOW_COLORED SHADOW_PIXEL=16 \
    !SSAO_ENABLED SSAO_QUALITY=1 \
    !LIGHT_SHAFTS_ENABLED LIGHT_SHAFTS_QUALITY=1 \
    BLOOM_ENABLED BLOOM_QUALITY=1 BLOOM_STRENGTH=0.35 \
    !GLARE_ENABLED GLARE_MODE=0 GLARE_QUALITY=1 GLARE_STRENGTH=0.20 \
    !DOF_ENABLED DOF_QUALITY=1 \
    AA_MODE=1 FXAA_QUALITY=1 MSAA_SAMPLES=2 AA_SHARPENING=0.25 \
    WATER_MODE=0 WATER_REFLECTIONS !WATER_REFRACTION !WATER_FOAM !WATER_SSR_ENABLED WATER_SSR_STEPS=8 !WATER_CAUSTICS WATER_WAVES_STRENGTH=0.75 \
    !WAVING_FOLIAGE !WAVING_WATER !FOLIAGE_SSS !RAIN_WETNESS !CA_ENABLED

