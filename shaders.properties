    BLOOM_ENABLED BLOOM_QUALITY=3 BLOOM_STRENGTH=0.45 \
    GLARE_ENABLED GLARE_MODE=4 GLARE_QUALITY=2 GLARE_STRENGTH=0.35 \
    DOF_ENABLED DOF_QUALITY=2 DOF_BOKEH_SHAPE=1 \
    AA_MODE=4 FXAA_QUALITY=3 MSAA_SAMPLES=4 AA_SHARPENING=0.45 \
    WATER_MODE=3 WATER_REFLECTIONS WATER_REFRACTION WATER_FOAM WATER_SSR_ENABLED WATER_SSR_STEPS=14 WATER_CAUSTICS WATER_WAVES_STRENGTH=1.00 \
    WAVING_FOLIAGE WAVING_WATER FOLIAGE_SSS RAIN_WETNESS !CA_ENABLED

profile.ULTRA = \
    SHADOW_ENABLED shadowMapResolution=2048 shadowDistance=192.0 SHADOW_QUALITY=3 SHADOW_SOFTNESS=0.25 SHADOW_COLORED SHADOW_PIXEL=16 \
    SSAO_ENABLED SSAO_QUALITY=2 SSAO_STRENGTH=0.95 \
    LIGHT_SHAFTS_ENABLED LIGHT_SHAFTS_QUALITY=2 LIGHT_SHAFTS_STRENGTH=0.85 \
    BLOOM_ENABLED BLOOM_QUALITY=4 BLOOM_STRENGTH=0.50 \
    GLARE_ENABLED GLARE_MODE=4 GLARE_QUALITY=3 GLARE_STRENGTH=0.40 \
    DOF_ENABLED DOF_QUALITY=3 DOF_BOKEH_SHAPE=1 \
    AA_MODE=5 FXAA_QUALITY=4 MSAA_SAMPLES=4 AA_SHARPENING=0.45 \
    WATER_MODE=3 WATER_REFLECTIONS WATER_REFRACTION WATER_FOAM WATER_SSR_ENABLED WATER_SSR_STEPS=20 WATER_CAUSTICS WATER_WAVES_STRENGTH=1.10 \
    WAVING_FOLIAGE WAVING_WATER FOLIAGE_SSS RAIN_WETNESS CA_ENABLED CA_STRENGTH=0.30

profile.EXTREME = \
    SHADOW_ENABLED shadowMapResolution=3072 shadowDistance=256.0 SHADOW_QUALITY=4 SHADOW_SOFTNESS=0.25 SHADOW_COLORED SHADOW_PIXEL=32 \
    SSAO_ENABLED SSAO_QUALITY=3 SSAO_STRENGTH=1.05 \
    LIGHT_SHAFTS_ENABLED LIGHT_SHAFTS_QUALITY=3 LIGHT_SHAFTS_STRENGTH=0.95 \
    BLOOM_ENABLED BLOOM_QUALITY=5 BLOOM_STRENGTH=0.55 \
    GLARE_ENABLED GLARE_MODE=4 GLARE_QUALITY=4 GLARE_STRENGTH=0.45 \
    DOF_ENABLED DOF_QUALITY=5 DOF_BOKEH_SHAPE=2 \
    AA_MODE=6 FXAA_QUALITY=4 MSAA_SAMPLES=8 AA_SHARPENING=0.45 \
    WATER_MODE=3 WATER_REFLECTIONS WATER_REFRACTION WATER_FOAM WATER_SSR_ENABLED WATER_SSR_STEPS=28 WATER_CAUSTICS WATER_WAVES_STRENGTH=1.25 \
    WAVING_FOLIAGE WAVING_WATER FOLIAGE_SSS RAIN_WETNESS CA_ENABLED CA_STRENGTH=0.40

# ============================================================================
# Detailed Menu Screens Layout
# ============================================================================

screen.columns = 2
screen = \
    <profile> COLOR_STYLE \
    AA_MODE WATER_MODE \
    SELECT_BOX_MODE DOF_MODE \
    <empty> <empty> \
    [COLOR_GRADING] [BLOOM_GLARE] \
    [DOF_SETTINGS] [AA_SETTINGS] \
    [SELECT_BOX] [LIGHTING_SHADOW] \
    [ATMOSPHERE_WATER] [POST_EFFECTS]

# 1. Color Style & RGB Tone Grading
screen.COLOR_GRADING.columns = 2
screen.COLOR_GRADING = \
    COLOR_STYLE COLOR_STYLE_STRENGTH \
    TONEMAP_OPERATOR EXPOSURE \
    BRIGHTNESS GAMMA \
    CONTRAST SATURATION \
    VIBRANCE COLOR_TEMPERATURE \
    COLOR_GREEN_MAGENTA <empty> \
    [RGB_GLOBAL] [RGB_THREEWAY] \
    [AUTO_EXP_MENU] <empty>

screen.RGB_GLOBAL.columns = 1
screen.RGB_GLOBAL = \
    COLOR_TONE_R \
    COLOR_TONE_G \
    COLOR_TONE_B

screen.RGB_THREEWAY.columns = 3
screen.RGB_THREEWAY = \
    SHADOW_TINT_R SHADOW_TINT_G SHADOW_TINT_B \
