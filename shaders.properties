    BLOOM_TINT_R \
    BLOOM_TINT_G \
    BLOOM_TINT_B

# 3. Depth of Field (Default DoF / Focus Blur / Reverse Focus / Manual / Tilt-Shift)
screen.DOF_SETTINGS.columns = 2
screen.DOF_SETTINGS = \
    DOF_ENABLED DOF_MODE \
    DOF_QUALITY DOF_STRENGTH \
